services:

  backend:
    build: .
    command: uvicorn backend.app:app --host 0.0.0.0 --port 8000
    working_dir: /app
    ports:
      - "8000:8000"

    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_RELOAD=true
      - CORS_ALLOWED_ORIGINS=http://localhost:8501
      - API_KEY=${API_KEY}
      - API_RATE_LIMIT=${API_RATE_LIMIT:-20}
      - PYTHONPATH=/app/backend

      - REDIS_URL=redis://redis:6379/0
      - JOB_TTL_SECONDS=${JOB_TTL_SECONDS:-3600}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-300}

      - GEMINI_REQUEST_TIMEOUT=${GEMINI_REQUEST_TIMEOUT:-10}
      - GEMINI_MAX_RETRIES=${GEMINI_MAX_RETRIES:-2}
      - GEMINI_RETRY_BASE_DELAY=${GEMINI_RETRY_BASE_DELAY:-0.5}

      - CIRCUIT_BREAKER_FAILURE_THRESHOLD=${CIRCUIT_BREAKER_FAILURE_THRESHOLD:-3}
      - CIRCUIT_BREAKER_RECOVERY_SECONDS=${CIRCUIT_BREAKER_RECOVERY_SECONDS:-60}

    volumes:
      - ./backend:/app/backend
      - chroma_data:/app/backend/chroma_db

    depends_on:
      redis:
        condition: service_healthy


  frontend:
    build: .
    command: streamlit run frontend/streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    working_dir: /app
    ports:
      - "8501:8501"

    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - API_BASE=http://backend:8000
      - API_KEY=${API_KEY}
      - PYTHONPATH=/app/backend

    depends_on:
      - backend


  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  worker:
    build: .
    restart: unless-stopped
    command: python -m workers.investigation_worker
    working_dir: /app

    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app/backend

      - JOB_TTL_SECONDS=${JOB_TTL_SECONDS:-3600}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-300}

      - GEMINI_REQUEST_TIMEOUT=${GEMINI_REQUEST_TIMEOUT:-10}
      - GEMINI_MAX_RETRIES=${GEMINI_MAX_RETRIES:-2}
      - GEMINI_RETRY_BASE_DELAY=${GEMINI_RETRY_BASE_DELAY:-0.5}

      - CIRCUIT_BREAKER_FAILURE_THRESHOLD=${CIRCUIT_BREAKER_FAILURE_THRESHOLD:-3}
      - CIRCUIT_BREAKER_RECOVERY_SECONDS=${CIRCUIT_BREAKER_RECOVERY_SECONDS:-60}

    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started

    volumes:
      - ./backend:/app/backend
      - chroma_data:/app/backend/chroma_db


volumes:
  chroma_data:
  redis_data: